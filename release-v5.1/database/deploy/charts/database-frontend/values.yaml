# Default values for database frontend helm chart.

image: ghcr.io/labring/sealos-database-frontend:latest
imagePullPolicy: Always

imagePullSecrets: []
fullnameOverride: "database-frontend"

replicaCount: 1

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - "ALL"

service:
  type: ClusterIP
  port: 3000

tests:
  image: busybox:1.36.1
  path: /healthz

startupProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 2
  timeoutSeconds: 3
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    cpu: 10m
    memory: 128Mi

ingress:
  className: nginx
  host: ""
  annotations: {}

# Keep release-v5.1 env defaults and names. Entrypoint auto-fills cloud values from sealos-config when available.
databaseConfig:
  cloudDomain: "127.0.0.1.nip.io"
  cloudPort: ""
  certSecretName: "wildcard-cert"
  tlsRejectUnauthorized: "1"
  monitorUrl: "http://database-monitor.sealos.svc.cluster.local:9090"
  migrateFileImage: ""
  backupEnabled: "true"
  logEnabled: "false"
  showDocument: "true"
  dataImportEnabled: "false"
  guideEnabled: "true"
  kafkaEnabled: "true"
  billingUrl: "http://account-service.account-system.svc:2333"
  managedDbEnabled: "false"
  vlogsBaseUrl: ""

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: "app"
                operator: In
                values:
                  - database-frontend
          topologyKey: "kubernetes.io/hostname"
