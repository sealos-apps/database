apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "database-frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "database-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "database-frontend.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        {{- include "database-frontend.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: cluster-version-reader
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: {{ .Values.dbproviderConfig.tlsRejectUnauthorized | quote }}
            - name: SEALOS_DOMAIN
              value: {{ .Values.dbproviderConfig.cloudDomain | quote }}
            - name: DESKTOP_DOMAIN
              value: {{ .Values.dbproviderConfig.cloudDomain | quote }}
            - name: SEALOS_PORT
              value: {{ include "database-frontend.portSuffix" . | quote }}
            - name: MONITOR_URL
              value: {{ .Values.dbproviderConfig.monitorUrl | quote }}
            - name: MIGRATE_FILE_IMAGE
              value: {{ .Values.dbproviderConfig.migrateFileImage | quote }}
            - name: BACKUP_ENABLED
              value: {{ .Values.dbproviderConfig.backupEnabled | quote }}
            - name: LOG_ENABLED
              value: {{ .Values.dbproviderConfig.logEnabled | quote }}
            - name: SHOW_DOCUMENT
              value: {{ .Values.dbproviderConfig.showDocument | quote }}
            - name: DATA_IMPORT_ENABLED
              value: {{ .Values.dbproviderConfig.dataImportEnabled | quote }}
            - name: GUIDE_ENABLED
              value: {{ .Values.dbproviderConfig.guideEnabled | quote }}
            - name: KAFKA_ENABLED
              value: {{ .Values.dbproviderConfig.kafkaEnabled | quote }}
            - name: BILLING_URL
              value: {{ .Values.dbproviderConfig.billingUrl | quote }}
            - name: MANAGED_DB_ENABLED
              value: {{ .Values.dbproviderConfig.managedDbEnabled | quote }}
            - name: VLOGS_BASE_URL
              value: {{ .Values.dbproviderConfig.vlogsBaseUrl | quote }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          volumeMounts:
            - name: dbprovider-frontend-volume
              mountPath: /app/database/.env
              subPath: .env
            - name: dbprovider-frontend-volume
              mountPath: /config.yaml
              subPath: config.yaml
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: dbprovider-frontend-volume
          configMap:
            defaultMode: 420
            name: {{ include "database-frontend.fullname" . }}-config
