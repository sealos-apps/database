# Custom values for database frontend helm chart.
# This file contains user-customizable configurations.

replicaCount: 1

resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    cpu: 10m
    memory: 128Mi

startupProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 2
  timeoutSeconds: 3
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3


# Keep release-v5.1 env defaults and names. Entrypoint auto-fills cloud values from sealos-config when available.
dbproviderConfig:
  # Direct Prometheus-compatible endpoint (not database-monitor).
  # Override via user values or --set-string dbproviderConfig.metricsUrl=<endpoint>.
  metricsUrl: "http://vmselect-vm-stack-victoria-metrics-k8s-stack.vm.svc.cluster.local:8481/select/0/prometheus"
  migrateFileImage: ""
  backupEnabled: "true"
  logEnabled: "false"
  showDocument: "true"
  dataImportEnabled: "false"
  guideEnabled: "true"
  kafkaEnabled: "false"
  billingUrl: "http://account-service.account-system.svc:2333"
  managedDbEnabled: "false"
  vlogsBaseUrl: "http://vlogs.sealos.svc.cluster.local:8428"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: "app"
                operator: In
                values:
                  - dbprovider-frontend
          topologyKey: "kubernetes.io/hostname"
