name: database-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish runtime and cluster images for both deployment profiles
        type: boolean
        default: false
      upload_oss:
        description: Publish images and upload cluster archives to OSS
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: corepack enable && corepack prepare pnpm@8.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir database typecheck
      - run: pnpm --dir database test:ci
      - run: node --test tests/test_*.cjs

  versions:
    needs: compatibility
    strategy:
      fail-fast: false
      matrix:
        source: [main, release-v5.1]
    uses: ./.github/workflows/build-version.yml
    with:
      source: ${{ matrix.source }}
      publish: ${{ github.event_name == 'push' || inputs.publish_images == true || inputs.upload_oss == true }}
      upload_oss: ${{ github.event_name == 'push' || inputs.upload_oss == true }}
    secrets: inherit

  release-assets:
    needs: versions
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cluster-*
          path: cluster-bundles
          merge-multiple: true
      - name: Verify and publish release assets
        working-directory: cluster-bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(*.tar.gz)
          checksums=(*.tar.gz.sha256)
          md5_checksums=(*.tar.gz.md5)
          [[ ${#archives[@]} -eq 4 && ${#checksums[@]} -eq 4 && ${#md5_checksums[@]} -eq 4 ]]
          sha256sum -c "${checksums[@]}"
          md5sum -c "${md5_checksums[@]}"
          if ! gh release view "$RELEASE_TAG" > /dev/null; then
            flags=()
            [[ "$RELEASE_TAG" != *-* ]] || flags+=(--prerelease)
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${archives[@]}" "${checksums[@]}" "${md5_checksums[@]}" --clobber
