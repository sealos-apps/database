name: database-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish runtime and cluster images for both source trees
        type: boolean
        default: false
      upload_oss:
        description: Publish images and upload cluster archives to OSS
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    strategy:
      fail-fast: false
      matrix:
        source: [main, release-v5.1]
    uses: ./.github/workflows/build-version.yml
    with:
      source: ${{ matrix.source }}
      publish: ${{ github.event_name == 'push' || inputs.publish_images == true || inputs.upload_oss == true }}
      upload_oss: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.upload_oss == true }}
    secrets: inherit
