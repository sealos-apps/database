name: Build database version

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      publish:
        required: true
        type: boolean
      upload_oss:
        required: true
        type: boolean

permissions:
  contents: read

env:
  DATAFLOW_IMAGE: ghcr.io/${{ github.repository }}/dataflow
  RUNTIME_IMAGE: ghcr.io/${{ github.repository }}/database-frontend
  CLUSTER_IMAGE: ghcr.io/${{ github.repository }}/database-cluster
  SEALOS_VERSION: v5.1.2-rc5

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prefix: ${{ steps.metadata.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute versioned metadata
        id: metadata
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          case "$SOURCE" in main|release-v5.1) ;; *) exit 1 ;; esac
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
            prefix="release/${version}/${SOURCE}"
          else
            version="${GITHUB_SHA:0:7}"
            prefix="ci/${SOURCE}/${version}"
          fi
          tag="${SOURCE}-${version}"
          [[ "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Validate chart and entrypoint
        working-directory: ${{ inputs.source }}/database/deploy
        run: |
          set -euo pipefail
          bash -n database-frontend-entrypoint.sh
          helm lint charts/database-frontend
          helm template dbprovider-frontend charts/database-frontend --namespace dbprovider-frontend > /dev/null
          python3 ../../../tests/test_deployment_compatibility.py
      - name: Validate DataFlow and combined installer
        run: |
          python3 scripts/test-bundle.py
          bash -n deploy/install.sh scripts/prepare-bundle.sh dataflow/deploy/install.sh
          helm lint dataflow/deploy/charts/dataflow -f dataflow/deploy/charts/dataflow/dataflow-values.yaml
          helm template dataflow dataflow/deploy/charts/dataflow --namespace dataflow-system -f dataflow/deploy/charts/dataflow/dataflow-values.yaml > /dev/null

  runtime:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runtime image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.source }}
          file: ./${{ inputs.source }}/Dockerfile
          build-args: |
            name=database
            path=database
          platforms: linux/${{ matrix.arch }}
          push: ${{ inputs.publish }}
          tags: ${{ env.RUNTIME_IMAGE }}:${{ needs.metadata.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=database-${{ inputs.source }}-${{ matrix.arch }}
          cache-to: type=gha,scope=database-${{ inputs.source }}-${{ matrix.arch }},mode=max
      - name: Build DataFlow runtime (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ./dataflow
          file: ./dataflow/core/Dockerfile
          build-args: |
            VERSION=${{ needs.metadata.outputs.tag }}
            PLATFORM=sealos
          platforms: linux/${{ matrix.arch }}
          push: ${{ inputs.publish }}
          tags: ${{ env.DATAFLOW_IMAGE }}:${{ needs.metadata.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=dataflow-${{ matrix.arch }}
          cache-to: type=gha,scope=dataflow-${{ matrix.arch }},mode=max

  runtime-release:
    needs: [metadata, runtime]
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish runtime manifest
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${RUNTIME_IMAGE}:${TAG}" \
            "${RUNTIME_IMAGE}:${TAG}-amd64" "${RUNTIME_IMAGE}:${TAG}-arm64"
          docker buildx imagetools create -t "${DATAFLOW_IMAGE}:${TAG}" \
            "${DATAFLOW_IMAGE}:${TAG}-amd64" "${DATAFLOW_IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${DATAFLOW_IMAGE}:${TAG}"
          docker buildx imagetools inspect "${RUNTIME_IMAGE}:${TAG}"

  cluster:
    needs: [metadata, runtime-release]
    if: inputs.publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Sealos
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          curl --retry 3 -fsSL -o "${work_dir}/sealos.tar.gz" \
            "https://github.com/labring/sealos/releases/download/${SEALOS_VERSION}/sealos_${SEALOS_VERSION#v}_linux_${ARCH}.tar.gz"
          tar -xzf "${work_dir}/sealos.tar.gz" -C "$work_dir" sealos
          sudo install "${work_dir}/sealos" /usr/local/bin/sealos
          sealos version
      - name: Login Sealos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: sudo sealos login -u "$GH_USER" -p "$GH_TOKEN" ghcr.io
      - name: Build, push and archive cluster image
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          bundle_dir="${RUNNER_TEMP}/database-bundle-${SOURCE}-${ARCH}"
          bash scripts/prepare-bundle.sh "$SOURCE" "$bundle_dir" "$RUNTIME_IMAGE" "$DATAFLOW_IMAGE" "$TAG"
          cd "$bundle_dir"
          sudo sealos registry save --registry-dir=registry --arch "$ARCH" .
          ref="${CLUSTER_IMAGE}:${TAG}-${ARCH}"
          sudo sealos build -t "$ref" --platform "linux/${ARCH}" -f Kubefile .
          sudo sealos push "$ref"
          archive="database-cluster-${TAG}-${ARCH}.tar"
          sudo sealos save -o "${RUNNER_TEMP}/${archive}" "$ref"
          sudo chown "$(id -u):$(id -g)" "${RUNNER_TEMP}/${archive}"
          gzip "${RUNNER_TEMP}/${archive}"
          cd "$RUNNER_TEMP"
          sha256sum "${archive}.gz" > "${archive}.gz.sha256"
          md5sum "${archive}.gz" > "${archive}.gz.md5"
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-${{ inputs.source }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/database-cluster-*.tar.gz
            ${{ runner.temp }}/database-cluster-*.tar.gz.sha256
            ${{ runner.temp }}/database-cluster-*.tar.gz.md5
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [metadata, runtime-release, cluster]
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish cluster manifest
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${CLUSTER_IMAGE}:${TAG}" \
            "${CLUSTER_IMAGE}:${TAG}-amd64" "${CLUSTER_IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${RUNTIME_IMAGE}:${TAG}"
          docker buildx imagetools inspect "${CLUSTER_IMAGE}:${TAG}"
      - name: Update source channel tags
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${DATAFLOW_IMAGE}:${SOURCE}" "${DATAFLOW_IMAGE}:${TAG}"
          docker buildx imagetools create -t "${RUNTIME_IMAGE}:${SOURCE}" "${RUNTIME_IMAGE}:${TAG}"
          docker buildx imagetools create -t "${CLUSTER_IMAGE}:${SOURCE}" "${CLUSTER_IMAGE}:${TAG}"
      - uses: actions/download-artifact@v4
        if: inputs.upload_oss
        with:
          pattern: cluster-${{ inputs.source }}-*
          path: cluster-bundles
          merge-multiple: true
      - name: Upload verified archives to OSS
        if: inputs.upload_oss
        working-directory: cluster-bundles
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_PREFIX: ${{ needs.metadata.outputs.prefix }}
        run: |
          set -euo pipefail
          : "${OSS_ENDPOINT:?OSS_ENDPOINT is required}"
          : "${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}"
          : "${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}"
          : "${OSS_BUCKET:?OSS_BUCKET is required}"
          shopt -s nullglob
          archives=(*.tar.gz)
          checksums=(*.tar.gz.sha256)
          md5_checksums=(*.tar.gz.md5)
          [[ ${#archives[@]} -eq 2 && ${#checksums[@]} -eq 2 && ${#md5_checksums[@]} -eq 2 ]]
          sha256sum -c "${checksums[@]}"
          md5sum -c "${md5_checksums[@]}"
          curl --retry 3 -fsSL https://gosspublic.alicdn.com/ossutil/install.sh -o "$RUNNER_TEMP/install-ossutil.sh"
          sudo bash "$RUNNER_TEMP/install-ossutil.sh"
          for file in "${archives[@]}" "${checksums[@]}" "${md5_checksums[@]}"; do
            ossutil64 cp -f -e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" \
              "$file" "oss://${OSS_BUCKET}/${OSS_PREFIX}/${file}"
          done
